name: JAWL Tests

on:
  push:
    branches: [ "main", "master", "beta-*" ] # Добавил поддержку твоих веток из _docs
  pull_request:
    branches: [ "main", "master" ]

jobs:
  test:
    name: Python ${{ matrix.python-version }} on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false # Если тест упадет на Windows, Ubuntu всё равно добежит до конца (удобно для дебага)
      matrix:
        # Тестируем на всех заявленных ОС
        os: [ubuntu-latest, windows-latest, macos-latest]
        # Тестируем на 3.11 (целевая), а также проверяем совместимость с 3.12 и 3.13
        python-version: ["3.11", "3.12", "3.13"]

    steps:
    - name: Клонирование кода
      uses: actions/checkout@v4

    - name: Установка uv
      uses: astral-sh/setup-uv@v3
      with:
        enable-cache: true
        cache-dependency-glob: "requirements.txt" # Кэш сбросится только если поменяются зависимости

    - name: Настройка Python ${{ matrix.python-version }}
      uses: actions/setup-python@v5
      with:
        python-version: ${{ matrix.python-version }}

    - name: Установка зависимостей через uv
      # Флаг --system ставит пакеты прямо в окружение раннера, чтобы не возиться с активацией venv в CI
      run: uv pip install --system -r requirements.txt

    - name: Запуск автотестов
      env:
        PYTHONPATH: .
      run: pytest -q tests/